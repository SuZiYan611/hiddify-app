name: Package Android Downloads
on:
  workflow_dispatch:
  push:
    branches: ['private-network']
    paths: ['.github/workflows/deliver-android.yml']
permissions:
  actions: read
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: SuZiYan611/hiddify-app
          run-id: '43022448232'
          name: private-network-android-debug
          path: downloaded
      - name: Inspect APKs and prepare ARM64 download
        run: |
          find downloaded -name '*.apk' -printf '%f %s bytes\n'
          mkdir -p arm64
          apk="$(find downloaded -name '*arm64*.apk' -print -quit)"
          test -n "$apk" || { echo 'The build did not produce an ARM64 split APK.'; exit 1; }
          cp "$apk" arm64/PrivateNetwork-Android-arm64.apk
          sha256sum arm64/PrivateNetwork-Android-arm64.apk > arm64/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: private-network-android-arm64
          path: arm64/*
          if-no-files-found: error
          retention-days: 30
